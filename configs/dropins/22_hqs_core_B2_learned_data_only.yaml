# OF-B2: Learned data only: analytic correction is exactly zero in both proposal and learned-data input.
# All non-intervened A0 components, schedules, evidence and supervision remain fixed.

run_name: hqs_core/ablation_B2_learned_data_only

mlflow:
  registered_model_name: HQSCoreB2LearnedDataOnly
  tags:
    architecture: hqs_core_operator_ablation
    ablation_group: OF-B
    ablation_id: B2
    condition: learned_data_only
    reference: A0

model:
  model_type: hqs_core_operator_ablation

  hqs_core:
    feature_channels: [32, 64, 96, 128]
    match_channels: [64, 96, 128, 128]
    context_channels: [64, 64, 96, 96]
    blocks_per_scale: [1, 2, 2, 2]
    groups: 8
    matching_pyramid: gmflow

    gmflow_feature_channels: 128
    gmflow_transformer_depth: 6
    gmflow_ffn_expansion: 4
    gmflow_attention_splits: 2
    gmflow_gradient_checkpointing: false
    gmflow_propagation_query_chunk_size: 256
    gmflow_released_weights_compatible: true
    gmflow_pretrained_checkpoint: ${oc.env:GMFLOW_CHECKPOINT,pretrained/gmflow_things-e9887eda.pth}
    gmflow_pretrained_strict: true
    gmflow_freeze_pretrained: true

    iterations: [2, 4, 2, 2]
    jacobi_sweeps: [2, 2, 1, 1]
    correlation_radii: [4, 4, 4, 3]
    all_pairs_levels: [1, 4]
    correlation_embedding_dim: 64
    local_corr_channel_chunk: 4
    local_corr_checkpoint: true

    coarse_hidden_dim: 96
    fine_hidden_dim: 64
    prior_hidden_channels: 64
    validity_hidden_dim: 32
    upsample_hidden_dim: 64

    max_data_delta: [2.0, 2.0, 1.5, 1.0]
    max_prox_delta: [0.5, 0.5, 0.5, 0.25]

    beta_initial: 0.10
    beta_minimum: 0.01
    lambda_initial: 0.08
    lambda_minimum: 0.001
    edge_alpha: 10.0
    analytic_weight: 1.0
    learned_data_weight: 1.0
    initial_reliability: 0.90
    allow_external_validity_inputs: false

    global_match_scale: 8
    global_match_transition_mode: native_residual
    global_decoder: soft_expectation
    global_correlation_mode: sqrt_dim
    global_temperature: 1.0
    global_query_chunk_size: 256
    global_confidence_gated: false
    global_confidence_floor: 0.0

    global_bidirectional: true
    global_use_flow_propagation: false
    global_propagation_routing: raw
    global_fb_data_gate: false
    global_fb_gate_source: raw
    global_fb_data_gate_scales: [16, 8]
    global_fb_alpha: 0.01
    global_fb_beta: 0.5
    global_fb_softness: 0.1
    global_fb_threshold_mode: gmflow

    operator_ablation:
      use_analytic_data: false
      use_learned_data: true
      analytic_input_to_learned: false
      use_analytic_prox: true
      use_learned_prox: true

loss:
  num_stages: 10
  stage_weight_mode: geometric
  gamma: 0.85
  global_init_weight: 0.0
  global_propagated_weight: 0.0
  global_confidence_weight: 0.0
  global_fb_visibility_weight: 0.0
  core_visibility_weight: 0.01
  core_visibility_last_n: 4
  smooth_weight: 0.00
  inter_smooth_weight: 0.0
  boundary_weight: 0.0
  raw_final_weight: 0.0
  iter_damp_weight: 0.0
  photo_weight: 0.00
  ofce_weight: 0.00
  detail_weight: 0.0
  occlusion_aware:
    enabled: false

training:
  amp: false
  lr: 1.0e-4
  warmup_pct: 0.05
  global_matcher_warmup_steps: 0
  freeze_backbone_during_global_warmup: false
  grad_clip: 1.0
  fail_on_nonfinite: true

data:
  detail_crop_prob: 0.0
