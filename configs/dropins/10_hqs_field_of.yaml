# HQS-Field-OF: probabilistic multi-hypothesis field inference.
#
# This is a new, traceable model path rather than a silent mutation of the
# negative-result HQS-LM implementation.
#
#   transformer-enhanced matching features
#       -> global/local correlation modes
#       -> recurrent calibration of mode weights and full precision
#       -> analytic mixture/HQS quadratic-majorisation solve
#       -> convex source-conditioned graph-field proximal
#
# The canonical path contains no feature-constancy Gauss-Newton term and no
# target-conditioned vector addition after the analytic data solve.

run_name: hqs_field_of/probabilistic_field_2_4_2_2

mlflow:
  registered_model_name: HQSFieldOpticalFlow
  tags:
    architecture: hqs_field_of
    solver: hqs_probabilistic_correlation_field
    data_operator: multimodal_correlation_quadratic_majorisation
    correspondence: topk_global_local_mixture
    observability: bidirectional_cycle_matchability_precision
    proximal: source_conditioned_convex_graph_field
    feature_linearisation: false
    learned_post_solve_vector: false

model:
  model_type: hqs_field_of

  hqs_field_of:
    # Encoder lists are fine-to-coarse: [1/2,1/4,1/8,1/16].
    feature_channels: [32, 64, 96, 128]
    match_channels: [64, 96, 128, 128]
    context_channels: [64, 64, 96, 96]
    blocks_per_scale: [1, 2, 2, 2]
    groups: 8

    # Matching transformers are coarse-to-fine: [1/16,1/8,1/4,1/2].
    # The source-only graph context bypasses all cross-image transformers.
    feature_transformer_depth: [1, 1, 1, 0]
    feature_transformer_heads: [4, 4, 4, 4]
    feature_transformer_max_tokens: [4096, 2048, 1024, 1024]
    feature_transformer_mlp_ratio: 2.0
    feature_transformer_dropout: 0.0
    feature_transformer_initial_blend: 0.10

    # Solver lists are coarse-to-fine: [1/16,1/8,1/4,1/2].
    iterations: [2, 4, 2, 2]
    graph_sweeps: [3, 3, 2, 2]
    correlation_radii: [4, 4, 4, 3]
    all_pairs_levels: [1, 4]
    num_hypotheses: [4, 4, 4, 4]
    mixture_temperatures: [0.07, 0.07, 0.10, 0.10]
    local_corr_channel_chunk: 4
    local_corr_checkpoint: true

    # Full correlation tensor calibration. Learned vectors adjust correlation
    # hypotheses and remain inside the analytic mixture solve.
    proposal_embedding_channels: [64, 64, 64, 64]
    proposal_hidden_channels: [96, 96, 64, 64]
    correlation_attention_channels: [32, 32, 32, 32]
    correlation_attention_heads: [4, 4, 4, 4]
    correlation_attention_temperature: 1.0
    maximum_attention_correlation_scale: 8.0
    max_hypothesis_delta: [2.0, 2.0, 1.5, 1.0]
    maximum_logit_adjustment: 2.0

    # Positive-semidefinite full 2x2 precision per correspondence mode.
    precision_minimum: 0.0
    precision_maximum: 1.0
    precision_correlation_limit: 0.95
    initial_precision: 0.20
    initial_matchability: 0.90
    confidence_floor: 0.02
    cycle_support_floor: 0.02
    responsibility_reference: proximal

    # Bidirectional support is decoded from the transpose of the existing
    # all-pairs volume; no second volume or ground-truth mask enters forward().
    cycle_scales: [16, 8]
    cycle_sigma: 1.5
    cycle_confidence_floor: 0.02

    # Source-only graph regulariser. Each sub-list is one scale, coarse-to-fine.
    graph_embedding_channels: [32, 32, 32, 32]
    graph_dilations:
      - [1, 2, 4]
      - [1, 2, 4]
      - [1, 2]
      - [1, 2]
    graph_feature_temperature: 0.25
    graph_edge_alpha: 10.0
    graph_anchor_floor: 0.05

    # Learned positive schedules; the update equations remain analytic.
    beta_initial: 0.10
    beta_minimum: 0.01
    damping_initial: 0.10
    damping_minimum: 0.001
    lambda_initial: 0.08
    lambda_minimum: 0.001
    proximal_inertia_initial: 0.05
    proximal_inertia_minimum: 0.001

    # Native-grid trust regions. The global MAP initialisation handles large
    # displacement; these bounds control iterative refinement.
    max_data_delta: [4.0, 3.0, 2.0, 1.0]

    global_temperature: 0.07
    global_query_chunk_size: 512
    upsample_hidden_dim: 64
    allow_external_validity_inputs: false

loss:
  num_stages: 10
  stage_weight_mode: geometric
  gamma: 0.85

  global_init_weight: 0.05
  core_visibility_weight: 0.01
  core_visibility_last_n: 4
  proposal_supervision_weight: 0.01
  proposal_matchability_weight: 0.002
  proposal_confidence_tau: 1.0
  proposal_supervision_last_n: 0
  mixture_supervision_weight: 0.02
  mixture_matchability_weight: 0.005
  mixture_supervision_temperature: 1.0
  mixture_supervision_last_n: 0

  # Small late-ramped terms address the empirically observed boundary and
  # high-frequency deficit without defining the inverse operator.
  boundary_weight: 0.01
  detail_weight: 0.02
  detail_start_step: 5000
  detail_ramp_steps: 5000
  detail_boundary_threshold: 1.0
  detail_boundary_boost: 2.0
  detail_high_pass_factor: 2

  smooth_weight: 0.0
  inter_smooth_weight: 0.0
  raw_final_weight: 0.0
  iter_damp_weight: 0.0
  photo_weight: 0.0
  ofce_weight: 0.0
  occlusion_aware:
    enabled: false

training:
  amp: true
  grad_clip: 1.0
  fail_on_nonfinite: true
  global_matcher_warmup_steps: 0
  freeze_backbone_during_global_warmup: false

data:
  detail_crop_prob: 0.10
