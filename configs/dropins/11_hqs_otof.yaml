# HQS-OTOF
#
# Controlled transplant model:
#   hierarchical transformer/FPN features
#     -> cached all-pairs 1/4 correlation
#     -> dustbin entropy-regularised optimal transport
#     -> local-expectation flow + confidence + observability
#     -> existing four-scale analytic HQS data/field iterations
#
# The optimal-transport front end is a clean-room implementation from the
# published FlowIt equations. FlowIt's learned GRU residual refinement is not
# part of this model.

run_name: hqs_otof/flowit_frontend_hqs_2_4_2_2

mlflow:
  registered_model_name: HQSOTOpticalFlow
  tags:
    architecture: hqs_otof
    solver: static_ot_initialisation_then_hqs_field
    measurement_backbone: hierarchical_transformer_fusion
    correspondence: all_pairs_quarter_resolution_sinkhorn
    unmatched_model: learned_dustbin
    initial_flow: local_expectation_about_transport_peak
    observability: real_transport_mass
    refinement: analytic_hqs_plus_source_graph
    flowit_gru_refinement: false
    learned_post_solve_vector: false

model:
  model_type: hqs_otof

  hqs_otof:
    # Encoder lists are fine-to-coarse: [1/2,1/4,1/8,1/16].
    feature_channels: [32, 64, 96, 128]
    match_channels: [64, 96, 128, 128]
    context_channels: [64, 64, 96, 96]
    blocks_per_scale: [1, 2, 2, 2]
    groups: 8

    # Per-scale transformer enhancement is coarse-to-fine.
    feature_transformer_depth: [1, 1, 1, 0]
    feature_transformer_heads: [4, 4, 4, 4]
    feature_transformer_max_tokens: [4096, 2048, 2048, 1024]
    feature_transformer_mlp_ratio: 2.0
    feature_transformer_dropout: 0.0
    feature_transformer_initial_blend: 0.10

    # FlowIt-style measurement front end. The score/plan is evaluated in
    # blocks but includes every source-target pair on the 1/4 grid.
    ot_scale: 4
    ot_fusion_scales: [4, 8, 16]
    ot_feature_channels: 128
    ot_temperature: 0.07
    ot_sinkhorn_iterations: 8
    ot_query_chunk_size: 128
    ot_local_expectation_radius: 2
    ot_num_hypotheses: 4
    ot_initial_dustbin_score: 1.0
    ot_state_sigma: 3.0
    ot_state_cost_clip: 50.0
    ot_covariance_floor: 0.05
    ot_precision_maximum: 4.0
    ot_maximum_tokens: 20000
    ot_gradient_checkpointing: true
    ot_cache_all_pairs_scores: true
    ot_half_precision_score_cache: true

    # Existing HQS-Field iterations, coarse-to-fine [1/16,1/8,1/4,1/2].
    iterations: [2, 4, 2, 2]
    graph_sweeps: [3, 3, 2, 2]
    correlation_radii: [4, 4, 4, 3]
    all_pairs_levels: [1, 4]
    num_hypotheses: [4, 4, 4, 4]
    mixture_temperatures: [0.07, 0.07, 0.10, 0.10]
    local_corr_channel_chunk: 4
    local_corr_checkpoint: true

    proposal_embedding_channels: [64, 64, 64, 64]
    proposal_hidden_channels: [96, 96, 64, 64]
    correlation_attention_channels: [32, 32, 32, 32]
    correlation_attention_heads: [4, 4, 4, 4]
    correlation_attention_temperature: 1.0
    maximum_attention_correlation_scale: 8.0
    max_hypothesis_delta: [2.0, 2.0, 1.5, 1.0]
    maximum_logit_adjustment: 2.0

    precision_minimum: 0.0
    precision_maximum: 1.0
    precision_correlation_limit: 0.95
    initial_precision: 0.20
    initial_matchability: 0.90
    confidence_floor: 0.02
    cycle_support_floor: 0.02
    responsibility_reference: proximal

    cycle_scales: [16, 8]
    cycle_sigma: 1.5
    cycle_confidence_floor: 0.02

    graph_embedding_channels: [32, 32, 32, 32]
    graph_dilations:
      - [1, 2, 4]
      - [1, 2, 4]
      - [1, 2]
      - [1, 2]
    graph_feature_temperature: 0.25
    graph_edge_alpha: 10.0
    graph_anchor_floor: 0.05

    beta_initial: 0.10
    beta_minimum: 0.01
    damping_initial: 0.10
    damping_minimum: 0.001
    lambda_initial: 0.08
    lambda_minimum: 0.001
    proximal_inertia_initial: 0.05
    proximal_inertia_minimum: 0.001
    max_data_delta: [4.0, 3.0, 2.0, 1.0]

    global_temperature: 0.07
    global_query_chunk_size: 512
    upsample_hidden_dim: 64
    allow_external_validity_inputs: false

loss:
  num_stages: 10
  stage_weight_mode: geometric
  gamma: 0.85

  global_init_weight: 0.10
  global_confidence_weight: 0.02
  global_confidence_tau: 1.0
  global_large_motion_threshold: 40.0
  global_large_motion_boost: 3.0
  ot_mixture_supervision_weight: 0.05
  ot_matchability_weight: 0.01
  ot_observability_weight: 0.02

  core_visibility_weight: 0.01
  core_visibility_last_n: 4
  proposal_supervision_weight: 0.01
  proposal_matchability_weight: 0.002
  proposal_confidence_tau: 1.0
  proposal_supervision_last_n: 0
  mixture_supervision_weight: 0.02
  mixture_matchability_weight: 0.005
  mixture_supervision_temperature: 1.0
  mixture_supervision_last_n: 0

  boundary_weight: 0.01
  detail_weight: 0.02
  detail_start_step: 10000
  detail_ramp_steps: 10000
  detail_boundary_threshold: 1.0
  detail_boundary_boost: 2.0
  detail_high_pass_factor: 2

  smooth_weight: 0.0
  inter_smooth_weight: 0.0
  raw_final_weight: 0.0
  iter_damp_weight: 0.0
  photo_weight: 0.0
  ofce_weight: 0.0
  occlusion_aware:
    enabled: false

training:
  amp: true
  grad_clip: 1.0
  fail_on_nonfinite: true
  global_matcher_warmup_steps: 5000
  freeze_backbone_during_global_warmup: true

# A 1/4 all-pairs matcher is expensive even with an FP16 score cache and
# blockwise FP32 Sinkhorn normalization.
# Curriculum stage data settings must retain batch_size=1 for this model.
data:
  batch_size: 2
  detail_crop_prob: 0.10

val_data:
  batch_size: 1
