# HQS-LM-OF: transformer- and attention-enhanced revised architecture.
#
# Complete data path:
#
#   transformer-enhanced matching features
#       -> indexed correlation at the current flow
#       -> per-iteration flow-conditioned hypothesis attention
#       -> recurrent vector observation + full 2x2 precision
#       -> analytic LM normal equation
#       -> source-conditioned proximal
#
# Learned target-conditioned vectors are observations inside the LM system.
# No learned vector is added after the solve.
#
# Curriculum launch:
#
#   python train_curriculum.py \
#     --config configs/default.yaml \
#     --override configs/dropins/08_hqs_lm_of.yaml \
#     --curriculum configs/curriculum/universal_replay_curriculum.yaml \
#     --base-run-name hqs_lm_of_2_4_2_2
#
# This file directly configures the canonical `hqs_lm_of` model path.

run_name: hqs_lm_of/transformer_attention_2_4_2_2

mlflow:
  registered_model_name: HQSLMOpticalFlow
  tags:
    architecture: hqs_lm_of
    solver: hqs_proximal_levenberg_marquardt
    data_operator: learned_probabilistic_measurement_inside_lm
    feature_pipeline: gated_self_cross_transformer
    iteration_attention: flow_conditioned_correlation
    correspondence_precision: full_symmetric_2x2
    proximal: source_only_motion_completion
    learned_data_vector_bypass: false

model:
  model_type: hqs_lm_of

  hqs_lm_of:
    # Encoder lists are fine-to-coarse: [1/2, 1/4, 1/8, 1/16].
    feature_channels: [32, 64, 96, 128]
    match_channels: [64, 96, 128, 128]
    context_channels: [64, 64, 96, 96]
    blocks_per_scale: [1, 2, 2, 2]
    groups: 8

    # Gated transformer enhancement is coarse-to-fine:
    # [1/16, 1/8, 1/4, 1/2]. Coarse scales obtain long-range self/cross-image
    # context; 1/4 uses native-grid windows; 1/2 is left convolutional to
    # preserve thin structures and control memory.
    feature_transformer_depth: [1, 1, 1, 0]
    feature_transformer_heads: [4, 4, 4, 4]
    feature_transformer_max_tokens: [4096, 2048, 1024, 1024]
    feature_transformer_mlp_ratio: 2.0
    feature_transformer_dropout: 0.0
    feature_transformer_initial_blend: 0.10

    # Solver lists are coarse-to-fine: [1/16, 1/8, 1/4, 1/2].
    iterations: [2, 4, 2, 2]
    jacobi_sweeps: [2, 2, 1, 1]
    correlation_radii: [4, 4, 4, 3]
    all_pairs_levels: [1, 4]
    match_temperatures: [0.07, 0.07, 0.10, 0.10]
    local_corr_channel_chunk: 4
    local_corr_checkpoint: true

    # The recurrent decoder retains every indexed correlation channel. The
    # vector it predicts is a measurement residual around the analytic soft
    # match, rather than an update added after the LM solve.
    proposal_embedding_channels: [64, 64, 64, 64]
    proposal_hidden_channels: [96, 96, 64, 64]
    max_learned_proposal_delta: [2.0, 2.0, 1.5, 1.0]

    # Each HQS iteration attends over correspondence hypotheses using the
    # current data flow, proximal disagreement, feature residual, confidence,
    # source context and iteration fraction. Attention changes the probabilistic
    # measurement only; it cannot directly modify flow.
    correlation_attention_channels: [32, 32, 32, 32]
    correlation_attention_heads: [4, 4, 4, 4]
    correlation_attention_temperature: 1.0
    # Prevent the learned raw-correlation attention gain from growing without
    # bound and overflowing the softmax logits under mixed precision.
    maximum_attention_correlation_scale: 8.0

    # Full correspondence precision P=[p_xx,p_xy,p_yy]. Matchability gates
    # the entire matrix and may approach zero. The bounded correlation
    # coefficient preserves positive semidefiniteness.
    learned_precision_minimum: 0.0
    learned_precision_maximum: 1.0
    learned_precision_initial: 0.20
    learned_precision_correlation_limit: 0.95
    initial_matchability: 0.90
    analytic_confidence_floor: 0.02

    prior_hidden_channels: 64
    reliability_hidden_channels: 32
    upsample_hidden_dim: 64

    # Pixel-unit trust regions at each native grid.
    max_data_delta: [2.0, 2.0, 1.5, 1.0]
    max_prox_delta: [0.5, 0.5, 0.5, 0.25]

    # Positive learned schedules. Each scale owns a schedule with the number
    # of entries specified by `iterations`.
    beta_initial: 0.10
    beta_minimum: 0.01
    damping_initial: 0.10
    damping_minimum: 0.001
    lambda_initial: 0.08
    lambda_minimum: 0.001

    # Operator-specific robust weighting.
    charbonnier_epsilon: 0.03
    charbonnier_alpha: 0.45
    initial_validity: 0.90

    # Source-only analytic and learned proximal.
    edge_alpha: 10.0
    minimum_data_anchor: 0.05

    # Fixed global all-pairs match used only to enter the local LM basin.
    global_temperature: 0.07
    global_query_chunk_size: 512
    global_confidence_gated: true
    global_confidence_floor: 0.05

    # Ground-truth visibility remains loss-only.
    allow_external_validity_inputs: false

loss:
  num_stages: 10
  stage_weight_mode: geometric
  gamma: 0.85

  global_init_weight: 0.05
  global_confidence_weight: 0.0
  core_visibility_weight: 0.01
  core_visibility_last_n: 4

  # Directly supervise the internal probabilistic observation on visible
  # pixels. Ground-truth flow and masks remain loss-only.
  proposal_supervision_weight: 0.02
  proposal_matchability_weight: 0.002
  proposal_confidence_tau: 1.0
  proposal_supervision_last_n: 0

  smooth_weight: 0.0
  inter_smooth_weight: 0.0
  boundary_weight: 0.0
  raw_final_weight: 0.0
  iter_damp_weight: 0.0
  photo_weight: 0.0
  ofce_weight: 0.0
  detail_weight: 0.0
  occlusion_aware:
    enabled: false

training:
  amp: true
  global_matcher_warmup_steps: 0
  freeze_backbone_during_global_warmup: false
  grad_clip: 1.0
  # Stop at the first failed batch and report the affected internal tensor
  # instead of silently averaging earlier finite batches around a NaN.
  fail_on_nonfinite: true

data:
  detail_crop_prob: 0.0
