# Native-resolution FlyingChairs validation configuration.
#
# evaluate_selected_dataset.py always constructs the dataset with split="val".
# FlyingChairsDataset therefore selects entries labelled 2 in
# <root>/train_val.txt (the standard split contains 640 validation pairs).

data:
  mode: single
  label: chairs
  name: chairs
  root: "/mnt/a/benchmark_data/optical_flow/FlyingChairs_release"
  dstype: clean
  batch_size: 1
  num_workers: 2

evaluation:
  native_resolution: true
  crop: false
  resize: false
  pad_to_stride: 8
  pad_mode: replicate
  write_scene_video: false
  scene_key: scene
