# Merge these fields under model.model_backbone and loss in the active config.
model:
  model_type: tfport
  model_backbone:
    # Phase switches
    use_bidirectional_training: true
    detach_reverse_for_geometry: true
    use_factorised_reliability: true
    use_fb_geometry: true
    use_forward_occupancy: true
    use_dual_path_update: true
    use_boundary_aware_prox: true

    # Geometry
    fb_alpha: 0.01
    fb_beta: 0.5
    occupancy_hole_threshold: 0.25
    occupancy_collision_threshold: 1.25
    occupancy_temperature: 0.10

    # Reliability
    reliability_input_channels: 11
    factorised_reliability_hidden_dim: 48
    reliability_recurrent_channels: 0
    detach_data_reliability_inputs: false
    minimum_data_gate: 0.0

    # Bounded updates
    data_max_delta: 4.0
    prior_max_delta: 4.0
    proximal_max_delta: 1.0

loss:
  occlusion_aware:
    enabled: true
    mixture_weight: 0.02
    visibility_weight: 0.01
    matchability_weight: 0.005
    cycle_weight: 0.01
    temporal_weight: 0.001
    visibility_prior_weight: 0.001
    outlier_scale: 20.0
    detach_reverse_for_cycle: true
    expected_visible_fraction: 0.85
    visibility_prior_tolerance: 0.10
