version: 1
repo_root: /home/bradrice/repos/torch_flow
output_root: ablation_runs

defaults:
  python: python
  entrypoint: train_curriculum.py
  config: configs/default.yaml
  curriculum: configs/curriculum/universal_replay_curriculum.yaml

jobs:
  A0:
    group: OF-A
    enabled: true
    implementation_status: ready
    tags: [reference, hqs, architecture]
    override: configs/dropins/16_hqs_core_pretrained_gmflow.yaml
    base_run_name: ablation/of_a/A0_full_hqs
    cli_overrides:
      - training.num_steps=50000
      - training.val_every=5000
      - training.save_every=10000
      - mlflow.enabled=false
      - training.skip_nonfinite_batches=true
      - training.max_nonfinite_skips=50
      - training.max_consecutive_nonfinite_skips=10

  A1:
    group: OF-A
    enabled: true
    implementation_status: ready
    tags: [recurrent_control, equal_capacity, architecture]
