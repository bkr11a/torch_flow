# =============================================================================
# HQSFlow – Default / Base Configuration
# All benchmark and ablation configs inherit from this and override as needed.
# =============================================================================

run_name: hqs_flow_default
log_dir:  logs
checkpoint_dir: checkpoints
use_wandb: false
wandb_project: hqs_flow

mlflow:
  enabled: true
  tracking_uri: "https://mlflow.spicedrice.home/"
  experiment_name: "torch_flow_test"
  insecure_tls: false
  strict: false
  log_checkpoints: true
  log_tensorboard: true
  register_best: true
  registered_model_name: "HQSFlowTFPort"
  best_alias: "best"
  tags:
    project: "torch_flow"
    framework: "pytorch"

# ── Model ─────────────────────────────────────────────────────────────────
model:
  model_type: tfport              # "tfport" | "original"
  upsample_scale: 8               # 1/upsample_scale encoder resolution → full res

  corr:                           # correlation pyramid (shared keys)
    num_levels: 4
    radius: 4

  model_backbone:                 # TFPort encoder / ConvGRU architecture
    # ── Shared encoder backbone ──────────────────────────────────────────
    base_channels: 64             # stem output channels [1.1: 32→64]
    channel_multiplier: [1, 2, 4] # per-stage channel scale (3 stages)
    blocks_per_stage: [2, 2, 2]   # residual blocks per stage
    groups: 8                     # GroupNorm groups
    dropout_rate: 0.0

    # ── Feature encoder ──────────────────────────────────────────────────
    feature_dim: 128             # projected feature dim (level2 used for corr) [1.1: 64→128]

    # ── Context encoder ──────────────────────────────────────────────────
    context_dim: 128             # context features passed to update unit each iter [1.1: 64→128]
    hidden_dim: 64               # context encoder seed dim (projected to gru_hidden_dim) [1.1: 32→64]

    # ── ConvGRU update unit ───────────────────────────────────────────────
    gru_hidden_dim: 128          # GRU hidden state channels [1.1: 64→128]
    motion_dim: 128              # MotionEncoder output channels [1.1: 64→128]

    # ── Iteration parameters ─────────────────────────────────────────────
    num_hqs_iterations: 12        # K unrolled HQS iterations (authoritative)
    max_displacement: 8           # correlation lookup radius [1.3: 4→8]
    num_corr_levels: 5            # correlation pyramid levels [1.3: 4→5]
    prox_jacobi_iters: 3          # inner Jacobi iterations for TV prox step
    refine_level1_iters: 0        # legacy level1 loop (superseded by pyramid_l1_iters)
    pyramid_l1_iters: 4           # 2.1: multi-scale HQS at level1 (1/4-scale) after main loop

    # ── HQS schedule / correction stability ────────────────────────────
    beta_min: 0.05
    beta_max: 0.50
    lambda_ratio_min: 0.25
    lambda_ratio_max: 0.45
    correction_gate_min: 0.05
    correction_gate_max: 0.50
    correction_gate_nonincreasing: true
    freeze_correction_last_n: 1
    freeze_correction_last_n_l1: 0
    allow_external_validity_inputs: false

    # ── Reliability mask update regime ─────────────────────────────────────
    use_split_delta_update: true

    # ── Alpha update parameters (for split delta update) ─────────────────────────────
    reliability_init_alpha: 0.75
    reliability_alpha_min: 0.05
    reliability_alpha_max: 0.95

    # ── Run: detach reliability inputs for stability ─────────────────────────────
    detach_reliability_inputs: true

    # Data reliability mask head (ablation: use GT-based mask instead)
    use_data_reliability_mask: true
    detach_data_reliability_inputs: true
    data_reliability_m_min: 0.00
    data_reliability_hidden_dim: 96

    # Factorised predicted validity; GT masks remain loss-only.
    use_factorised_reliability: false
    factorised_reliability_hidden_dim: 48
    reliability_recurrent_channels: 0
    minimum_data_gate: 0.0
    detach_reverse_for_geometry: true
    fb_alpha: 0.01
    fb_beta: 0.5
    occupancy_hole_threshold: 0.25
    occupancy_collision_threshold: 1.25
    occupancy_temperature: 0.10
    reliability_corr_temperature: 0.10
    use_boundary_aware_prox: false
    proximal_max_delta: 1.0

    # -- Use a learned proximal operator instead of jacobi iterations (ablation) --
    use_learned_prox: true
    prox_hidden_dim: 96
    prox_scale_factor: 1.00               # scale down prox output to prevent divergence

    # -- Use a masked OFCE warp to eliminate target frame leakage in temporal gradient calculation --
    use_masked_ofce_warp: true
    # -- Use self occupancy masking in the OFCE warp to prevent corrupting features with out-of-bounds or invalid pixel warps --
    use_self_occupancy_mask: true

    # -- Photometric confidence settings --
    use_photometric_confidence: false
    photometric_confidence_tau: 0.25

    # OFCE input settings
    use_photo_for_ofce: true       # Whether to use [0, 1] scaling for the photo inputs into the OFCE or ImageNETs normalization. true is [0, 1], false is ImageNETs normalization.
    ofce_greyscale: true           # Whether to use greyscale inputs for the OFCE. This is useful for illumination modeling.
    # -- Physics-Gated Global Matching Attention (PGMA) settings --
    use_pgma: true
    use_gmflow_init: true
    use_pgma_iter: true
    pgma_max_delta_step: 0.0
    gmflow_init_scale: 1.0
    gmflow_confidence_gated: true
    gmflow_confidence_floor: 0.05

    pgma_hidden_dim: 64
    pgma_temperature: 0.07
    pgma_topk: 64
    pgma_use_topk: true
    pgma_match_mode: soft
    pgma_use_feature_enhancer: true
    pgma_gate_init_hqs: 1.5
    pgma_gate_init_global: -1.0
    pgma_gate_init_prox: -1.0
    pgma_query_chunk_size: 512
    pgma_position_scale: 0.05
    pgma_confidence_floor: 0.05

    # -- Direct initial flow regression head settings --
    use_direct_init_head: true
    direct_init_hidden_dim: 128
    direct_init_use_global_stats: true
    direct_init_max_flow: 16.0

    # -- Transformer-based feature enhancer settings --
    use_transformer_feature_enhancer: true
    transformer_heads: 4
    transformer_depth: 1
    transformer_mlp_ratio: 2.0
    transformer_dropout: 0.0
    transformer_max_tokens: 4096

    # -- Multi-scale global-to-local initialization --
    use_multiscale_global_init: true
    ms_local_radius: 4
    ms_local_temperature: 0.05
    use_level1: true

    # Half-resolution analytic HQS + fixed high-pass full-resolution detail.
    use_band_split_refiner: false
    pyramid_l0_iters: 2
    detail_hidden_dim: 96
    detail_data_beta: 0.10
    detail_half_step: 0.50
    detail_max_data_delta: 1.50
    detail_max_prior_delta: 1.00
    detail_max_prox_delta: 0.50
    detail_max_full_delta: 4.0
    detail_photometric_tau: 0.10
    detail_high_pass_factor: 2

# ── Loss ──────────────────────────────────────────────────────────────────
loss:
  gamma: 0.85                     # geometric decay over stages (used when stage_weight_mode: geometric)
  max_flow: 400.0                 # ignore GT with magnitude > this (px)
  loss_fn: charbonnier            # "charbonnier" | "l1" | "l2"
  # 2.2 adaptive stage weighting: prevents trivial collapse via min-floor mixture
  stage_weight_mode: learnable    # "geometric" | "learnable"
  num_stages: 16                  # num_hqs_iterations(12) + pyramid_l1_iters(4)
  stage_weight_min_frac: 0.15     # each stage gets >= min_frac/K total weight
  smooth_weight: 0.0
  inter_smooth_weight: 0.0        # edge-aware smoothness on intermediate stages
  boundary_weight: 0.0            # GT flow-boundary supervision
  boundary_thresh: 0.03           # GT gradient threshold for boundary mask
  raw_final_weight: 0.0           # supervise raw pre-refinement final flow
  iter_damp_weight: 0.0           # late-iteration update damping
  iter_damp_start_frac: 0.5       # apply damping from this fraction of iterations onward
  photo_weight: 0.0
  ofce_weight: 0.0                # Optical Flow Constraint Equation loss
  detail_weight: 0.0
  detail_start_step: 0
  detail_ramp_steps: 0
  detail_boundary_threshold: 1.0
  detail_boundary_boost: 2.0
  detail_high_pass_factor: 2
  global_init_weight: 0.0
  global_confidence_weight: 0.0
  global_confidence_tau: 1.0
  global_large_motion_threshold: 40.0
  global_large_motion_boost: 2.0
  occlusion_aware:
    enabled: false
    mixture_weight: 0.02
    visibility_weight: 0.01
    matchability_weight: 0.005
    cycle_weight: 0.01
    temporal_weight: 0.001
    visibility_prior_weight: 0.001
    boundary_weight: 0.005
    outlier_scale: 20.0
    detach_reverse_for_cycle: true
    expected_visible_fraction: 0.85
    visibility_prior_tolerance: 0.10

# ── Training ──────────────────────────────────────────────────────────────
training:
  num_steps: 100000
  lr: 4.0e-4
  weight_decay: 1.0e-4
  warmup_pct: 0.05
  global_matcher_warmup_steps: 0
  freeze_backbone_during_global_warmup: false
  grad_clip: 1.0
  log_every: 100
  val_every: 5000
  save_every: 10000
  checkpoint: null               # path to resume from
  resume_mode: full              # "full" | "weights_only"

# ── Data ──────────────────────────────────────────────────────────────────
data:
  name: chairs                   # "chairs" | "things" | "sintel" | "spring" | "kitti"
  root: /mnt/a/benchmark_data/optical_flow/FlyingChairs_release
  batch_size: 6
  num_workers: 4
  crop_size: [368, 496]
  min_scale: -0.1
  max_scale: 1.0
  detail_crop_prob: 0.0           # chance to bias crops toward high-detail regions
  dstype: clean

val_data:
  name: chairs
  root: /mnt/a/benchmark_data/optical_flow/FlyingChairs_release
  batch_size: 4
  num_workers: 2
  crop_size: [368, 496]
