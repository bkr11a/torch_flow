# =============================================================================
# HQSFlow – Default / Base Configuration
# All benchmark and ablation configs inherit from this and override as needed.
# =============================================================================

run_name: hqs_flow_default
log_dir:  logs
checkpoint_dir: checkpoints
use_wandb: false
wandb_project: hqs_flow

mlflow:
  enabled: true
  tracking_uri: "https://mlflow.spicedrice.home/"
  experiment_name: "torch_flow_test"
  insecure_tls: false
  strict: false
  log_checkpoints: true
  log_tensorboard: true
  register_best: true
  registered_model_name: "HQSFlowTFPort"
  best_alias: "best"
  tags:
    project: "torch_flow"
    framework: "pytorch"

# ── Model ─────────────────────────────────────────────────────────────────
model:
  model_type: tfport              # "tfport" | "original"
  num_stages: 12                  # K unrolled HQS iterations
  upsample_scale: 8               # 1/upsample_scale encoder resolution → full res

  corr:                           # correlation pyramid (shared keys)
    num_levels: 4
    radius: 4

  model_backbone:                 # TFPort encoder / ConvGRU architecture
    # ── Shared encoder backbone ──────────────────────────────────────────
    base_channels: 32             # stem output channels
    channel_multiplier: [1, 2, 4] # per-stage channel scale (3 stages)
    blocks_per_stage: [2, 2, 2]   # residual blocks per stage
    groups: 8                     # GroupNorm groups
    dropout_rate: 0.0

    # ── Feature encoder ──────────────────────────────────────────────────
    feature_dim: 128              # projected feature dim (level2 used for corr)

    # ── Context encoder ──────────────────────────────────────────────────
    context_dim: 128              # context features passed to update unit each iter
    hidden_dim: 64                # context encoder seed dim (projected to gru_hidden_dim)

    # ── ConvGRU update unit ───────────────────────────────────────────────
    gru_hidden_dim: 128           # GRU hidden state channels
    motion_dim: 128               # MotionEncoder output channels

    # ── Iteration parameters ─────────────────────────────────────────────
    num_hqs_iterations: 12        # overrides model.num_stages if set
    max_displacement: 4           # correlation lookup radius
    num_corr_levels: 4            # correlation pyramid levels
    prox_jacobi_iters: 3          # inner Jacobi iterations for TV prox step

# ── Loss ──────────────────────────────────────────────────────────────────
loss:
  gamma: 0.85                     # geometric decay over stages
  max_flow: 400.0                 # ignore GT with magnitude > this (px)
  loss_fn: charbonnier            # "charbonnier" | "l1" | "l2"
  smooth_weight: 0.0
  photo_weight: 0.0
  ofce_weight: 0.0                # Optical Flow Constraint Equation loss

# ── Training ──────────────────────────────────────────────────────────────
training:
  num_steps: 100000
  lr: 4.0e-4
  weight_decay: 1.0e-4
  warmup_pct: 0.05
  grad_clip: 1.0
  log_every: 100
  val_every: 5000
  save_every: 10000
  checkpoint: null               # path to resume from
  resume_mode: full              # "full" | "weights_only"

# ── Data ──────────────────────────────────────────────────────────────────
data:
  name: chairs                   # "chairs" | "things" | "sintel" | "spring" | "kitti"
  root: ./data/benchmark_data/FlyingChairs_release
  batch_size: 6
  num_workers: 4
  crop_size: [368, 496]
  min_scale: -0.1
  max_scale: 1.0
  dstype: clean

val_data:
  name: chairs
  root: ./data/benchmark_data/FlyingChairs_release
  batch_size: 4
  num_workers: 2
  crop_size: [368, 496]
